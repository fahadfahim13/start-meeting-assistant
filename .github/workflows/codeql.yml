name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries catch existing code.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for source
        id: src
        run: |
          if [ -d src ] && [ -n "$(find src -name '*.ts' -o -name '*.tsx' 2>/dev/null | head -1)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No TypeScript source yet (Phase 0). Skipping analysis."
          fi

      - uses: github/codeql-action/init@v3
        if: steps.src.outputs.exists == 'true'
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        if: steps.src.outputs.exists == 'true'
